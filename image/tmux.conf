# orca's tmux defaults for terminals. tmux reads a project's own ~/.tmux.conf after this,
# so any of it can be changed there. The prefix stays tmux's usual Ctrl-b; in tmux inside
# tmux, pressing it twice reaches the inner one.

# Each terminal is an ordinary interactive shell, not a login shell (tmux's default): a login
# shell runs /etc/profile, which replaces the image's PATH (losing ~/.local/bin and the image's
# claude), and reads ~/.bashrc only through a ~/.profile, which a new home doesn't have
set -g default-command "exec bash"

# Scrolling and selecting with the mouse, and a long scrollback
set -g mouse on
set -g history-limit 50000

# Colors, and the keys and notifications Claude Code needs (code.claude.com/docs/en/terminal-config)
set -g default-terminal tmux-256color
set -as terminal-features ',xterm*:RGB'
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -g focus-events on
set -s escape-time 10

# The window's title and status line name the project and terminal: "app · 2"
# (ORCA_PROJECT is set on every orca container)
set -g @project "$ORCA_PROJECT"
set -g set-titles on
set -g set-titles-string '#{@project} · #S'
set -g status-left '#{@project} · #S  '
set -g status-left-length 40
set -g status-right ''
