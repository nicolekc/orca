# The orca command (cli/): tests on every pull request and push; an end-to-end run against
# real Docker; and on main, builds for every platform published as a release of their own,
# cli-<commit>, the newest marked latest, which cli/install.sh and `orca update` download from.
name: CLI

on:
  push:
    branches: [main]
  pull_request:

# Read-only unless a job says otherwise
permissions:
  contents: read

env:
  BUN_VERSION: 1.4.3

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      cli: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: diff
        run: .github/changed.sh cli package.json bun.lock bunfig.toml tsconfig.json Makefile .github/workflows/cli.yml

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: npm install -g "bun@$BUN_VERSION"
      - run: make install
      # The browser tests' Chromium and code-server, downloaded again only when their versions change
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/orca-test
          key: browsers-${{ hashFiles('bun.lock', 'cli/test/browser/code-server.sh') }}
      - run: bun x playwright install-deps chromium   # the system libraries it needs
      - run: make check

  e2e:
    needs: [changes, test]
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # for the commit the published image was built from
      - run: npm install -g "bun@$BUN_VERSION"
      - run: make install build
      # The published image, unless the image's files changed since the commit it was built
      # from (its label): a pull request that changes it, or a push whose image is still building
      - name: Get this commit's image
        env:
          PUBLISHED: ghcr.io/${{ github.repository }}:latest
        run: |
          docker pull -q "$PUBLISHED"
          built=$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$PUBLISHED")
          if [ -n "$built" ] && git cat-file -e "$built^{commit}" 2>/dev/null &&
             git diff --quiet "$built" HEAD -- Dockerfile image .github/check-image.sh; then
            echo "The published image (built from $built) is this commit's"
            docker tag "$PUBLISHED" orca:latest
          else
            echo "The image changed since the published one (built from ${built:-an unknown commit}): building it"
            docker build -t orca:latest .
          fi
      - run: bash cli/test/e2e/e2e.sh dist/orca-linux-x64

  release:
    if: github.event_name == 'push' && needs.changes.outputs.cli == 'true'
    needs: [changes, test, e2e]
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # replacing the release's files
    concurrency: cli-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: npm install -g "bun@$BUN_VERSION"
      - run: make install dist
      # A draft until every file is up, then latest: a download reads `version` from the
      # latest release and fetches the rest from that same one, so it never mixes two builds.
      # Latest only if it's newer than the latest already out: merges close together can finish
      # out of order, and an older build mustn't replace a newer one (it's still published).
      # (GitHub has one latest per repo; anything else this repo releases should pass --latest=false.)
      - name: Publish, as the latest release if it's the newest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="cli-$(cat dist/version)"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true   # a re-run of this commit
          gh release create "$tag" dist/orca-* dist/version --draft --target "$GITHUB_SHA" \
            --title "orca $(cat dist/version)" --notes "The orca command, built from $GITHUB_SHA. Install: cli/install.sh"
          # The latest release's commit; none yet (a 404) makes this one the latest
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" -q .target_commitish 2>/dev/null) || latest=""
          newest=true
          if [ -n "$latest" ]; then
            status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$latest...$GITHUB_SHA" -q .status)
            [ "$status" = ahead ] || [ "$status" = identical ] || newest=false
          fi
          if [ "$newest" = false ]; then
            echo "Not marked latest: $(cat dist/version) is older than the latest release's commit, $latest"
          fi
          gh release edit "$tag" --draft=false --latest="$newest"
      # The few before it stay, for downloads already under way
      - name: Remove older releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            -q '[.[] | select(.tagName | startswith("cli-"))] | sort_by(.createdAt) | reverse | .[5:][] | .tagName' |
            while read -r tag; do gh release delete "$tag" --yes --cleanup-tag; done
