# Builds the orca image for Intel and Apple Silicon and publishes it as
# ghcr.io/<owner>/orca:latest, which orca-update.sh pulls.
#
# Builds reuse unchanged layers from a cache kept in the registry (:buildcache-<arch>), so a
# rebuild yields the same layers and a pull downloads only what changed. The monthly run
# (and a manual run with "fresh") rebuilds everything, picking up new tool versions.
# Pull requests build and check the image without publishing it.
name: Image

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      fresh:
        description: Rebuild every layer, ignoring the cache
        type: boolean
        default: false

# Read-only unless a job says otherwise. Fork pull requests always get a read-only token
# and no secrets, whatever this says.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write   # pushing layers and the build cache (main only)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          platforms: ${{ matrix.platform }}
          no-cache: ${{ github.event_name == 'schedule' || github.event.inputs.fresh == 'true' }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }}
          # Only main updates the cache; pull requests read it
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache-{1},mode=max', env.IMAGE, matrix.arch) || '' }}
          # Pull requests keep the image locally to check it; otherwise push each platform
          # by digest, and the publish job tags both as :latest together
          outputs: ${{ github.event_name == 'pull_request' && 'type=docker,name=orca-check' || format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) }}
      - name: Check the tools work
        if: github.event_name == 'pull_request'
        run: |
          home=$(mktemp -d) && chmod 777 "$home"
          docker run --rm -v "$home:/home/node" -v "$PWD/.github:/check:ro" orca-check bash /check/check-image.sh
      - name: Save digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name != 'pull_request'
        with:
          name: digest-${{ matrix.runner }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write   # tagging the published image
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag both platforms as latest
        working-directory: /tmp/digests
        run: docker buildx imagetools create -t "$IMAGE:latest" $(printf "$IMAGE@sha256:%s " *)
