# Builds the orca image for Intel and Apple Silicon and publishes it as
# ghcr.io/<owner>/orca:latest, which orca-update.sh pulls. Every build starts from scratch
# on a fresh runner, so the weekly run picks up new tool versions even if nothing changed.
# Pull requests only check that the image builds.
name: Image

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ matrix.platform }}
          # Pull requests keep the image locally to check it; otherwise push each platform
          # by digest, and the publish job tags both as :latest together
          outputs: ${{ github.event_name == 'pull_request' && 'type=docker,name=orca-check' || format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) }}
      - name: Check the tools work
        if: github.event_name == 'pull_request'
        run: |
          home=$(mktemp -d) && chmod 777 "$home"
          docker run --rm -v "$home:/home/node" -v "$PWD/.github:/check:ro" orca-check bash /check/check-image.sh
      - name: Save digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: digest-${{ matrix.runner }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag both platforms as latest
        working-directory: /tmp/digests
        run: docker buildx imagetools create -t "$IMAGE:latest" $(printf "$IMAGE@sha256:%s " *)
