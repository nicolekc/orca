# Builds the orca image for Intel and Apple Silicon and publishes it as
# ghcr.io/<owner>/orca:latest, which `orca update` pulls.
#
# Builds reuse unchanged layers from a cache kept in the registry (:buildcache-<arch>), so a
# rebuild yields the same layers and a pull downloads only what changed. The monthly run
# (and a manual run with "fresh") rebuilds everything, picking up new tool versions.
# Pull requests build and check the image without publishing it. Pushes and pull requests
# that don't touch the image skip the build; the build jobs still run (and pass) because the
# ruleset requires them by name.
name: Image

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      fresh:
        description: Rebuild every layer, ignoring the cache
        type: boolean
        default: false

# Read-only unless a job says otherwise. Fork pull requests always get a read-only token
# and no secrets, whatever this says.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        run: .github/changed.sh Dockerfile image .github/check-image.sh .github/workflows/image.yml

  build:
    needs: changes
    strategy:
      # The repo's `main` ruleset requires these jobs by name, e.g.
      # "build (linux/amd64, amd64, ubuntu-24.04)", and the name comes from these matrix
      # values. If they change, update the required checks in Settings → Rules → Rulesets,
      # or pull requests wait forever for checks that no longer exist.
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write   # pushing layers and the build cache (main only)
    # Every step checks the image changed: skipping the job instead would report a single
    # "build" check, not the per-platform ones the ruleset waits for
    env:
      CHANGED: ${{ needs.changes.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.CHANGED == 'true'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: env.CHANGED == 'true'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.CHANGED == 'true' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        if: env.CHANGED == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: ${{ matrix.platform }}
          # The commit it's built from, so tests can tell whether a commit's image is published
          labels: org.opencontainers.image.revision=${{ github.sha }}
          no-cache: ${{ github.event_name == 'schedule' || github.event.inputs.fresh == 'true' }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }}
          # Only main updates the cache; pull requests read it
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache-{1},mode=max', env.IMAGE, matrix.arch) || '' }}
          # Pull requests keep the image locally to check it; otherwise push each platform
          # by digest, and the publish job tags both as :latest together
          outputs: ${{ github.event_name == 'pull_request' && 'type=docker,name=orca-check' || format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) }}
      - name: Check the tools work
        if: env.CHANGED == 'true' && github.event_name == 'pull_request'
        run: |
          home=$(mktemp -d) && chmod 777 "$home"
          docker run --rm -v "$home:/home/node" -v "$PWD/.github:/check:ro" \
            orca-check bash /check/check-image.sh
      - name: Save digest
        if: env.CHANGED == 'true' && github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.CHANGED == 'true' && github.event_name != 'pull_request'
        with:
          name: digest-${{ matrix.runner }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    if: github.event_name != 'pull_request' && needs.changes.outputs.image == 'true'
    needs: [changes, build]
    runs-on: ubuntu-24.04
    permissions:
      packages: write   # tagging the published image
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag both platforms as latest
        working-directory: /tmp/digests
        run: docker buildx imagetools create -t "$IMAGE:latest" $(printf "$IMAGE@sha256:%s " *)
